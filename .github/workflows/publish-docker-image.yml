name: Build and publish images
on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - develop

jobs:
  build_docker_image:
    name: Build Docker image
    runs-on: ubuntu-24.04
    env:
      DOCKER_IMAGE_NAME: 'bricekm/noodle-memories'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5

      - name: 'Extract Docker metadata'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}

      - name: 'Login to Docker Registry'
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Build Docker image for pull requests'
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:pr
          labels: ${{ steps.meta.outputs.labels }}

      - name: 'Build Docker image for develop'
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:develop
          labels: ${{ steps.meta.outputs.labels }}

      - name: 'Build and push Docker image for tags'
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
