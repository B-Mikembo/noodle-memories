version: 2
updates:
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '00:00'
    open-pull-requests-limit: 15
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '00:00'
    open-pull-requests-limit: 10
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/.github/actions/setup'
    schedule:
      interval: 'daily'
      time: '00:00'
    open-pull-requests-limit: 10
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/.github/workflows'
    schedule:
      intervale: 'daily'
      time: '00:00'
    open-pull-requests-limit: 10
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'
