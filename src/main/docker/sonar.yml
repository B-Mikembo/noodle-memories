services:
  sonar:
    image: sonarqube:25.10.0.114319-community
    container_name: sonar

    environment:
      - SONAR_FORCEAUTHENTICATION=false

    ports:
      - '127.0.0.1:9001:9000'

  sonar-token:
    build:
      context: .
      dockerfile: sonar/Dockerfile
    container_name: sonar-token
    environment:
      - NOODLE_MEMORIES_SONAR_URL=http://sonar:9000
    depends_on:
      - sonar
