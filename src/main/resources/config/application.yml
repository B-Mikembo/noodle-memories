logging:
  level:
    dev:
      brice:
        memories: INFO
spring:
  application:
    name: NoodleMemoriesApplication
  jackson:
    default-property-inclusion: non_absent
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      poolName: Hikari
    password: ''
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/NoodleMemoriesApplication
    username: NoodleMemoriesApplication
server:
  port: 8080
